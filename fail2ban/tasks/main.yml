---
- name: Deploy fail2ban jail configs
  ansible.builtin.template:
    src: jail.local.j2
    dest: "/etc/fail2ban/jail.d/{{ item.name }}.local"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ fail2ban_jails }}"
  notify: restart fail2ban

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: yes
