---
- name: reload nftables
  ansible.builtin.service:
    name: nftables
    state: reloaded

- name: restart docker after nftables reload
  ansible.builtin.service:
    name: docker
    state: restarted
  when: nftables_docker_enabled | default(false)

- name: apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true
