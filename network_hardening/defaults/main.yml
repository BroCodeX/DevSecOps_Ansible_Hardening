---
nftables_conf_path: /etc/nftables.conf
nftables_restore_script_path: /usr/local/sbin/restore_nft_rules.sh
nftables_ssh_port: 22
nftables_web_enabled: false   # true — открыть tcp 80 и 443
nftables_docker_enabled: false # true — хост крутит Docker: разрешить forward
                                # между docker-бриджами (docker0, br-*) и
                                # включить ip_forward, иначе Docker не может
                                # маршрутизировать/NAT'ить трафик контейнеров

sysctl_conf_path: /etc/sysctl.d/99-hardening.conf
sysctl_params:
  - { name: 'net.ipv4.conf.all.accept_redirects',     value: 0 }
  - { name: 'net.ipv4.conf.default.accept_redirects', value: 0 }
  - { name: 'net.ipv6.conf.all.accept_redirects',     value: 0 }
  - { name: 'net.ipv6.conf.default.accept_redirects', value: 0 }
  - { name: 'net.ipv4.conf.all.send_redirects',       value: 0 }
  - { name: 'net.ipv4.conf.all.log_martians',         value: 0 }
  - { name: 'net.ipv4.conf.default.log_martians',     value: 0 }
  - { name: 'net.ipv4.conf.all.rp_filter',            value: 1 }
  - { name: 'kernel.yama.ptrace_scope',               value: 1 }
  - { name: 'kernel.kptr_restrict',                   value: 2 }
  - { name: 'kernel.sysrq',                           value: 0 }
  - { name: 'net.ipv4.ip_forward',                    value: "{{ 1 if nftables_docker_enabled else 0 }}" }
  - { name: 'net.ipv6.conf.all.forwarding',           value: "{{ 1 if nftables_docker_enabled else 0 }}" }
