---
zookeeper_rules:
  - rich_rule: 'rule family="ipv4" source ipset="group_zookeeper" port port="2888" protocol="tcp" accept'
    state: enabled
  - rich_rule: 'rule family="ipv4" source ipset="group_zookeeper" port port="3888" protocol="tcp" accept'
    state: enabled
  - rich_rule: 'rule family="ipv4" source ipset="group_zookeeper" port port="2181" protocol="tcp" accept'
    state: enabled
  - rich_rule: 'rule family="ipv4" source ipset="group_kafka" port port="2888" protocol="tcp" accept'
    state: enabled
  - rich_rule: 'rule family="ipv4" source ipset="group_kafka" port port="3888" protocol="tcp" accept'
    state: enabled
  - rich_rule: 'rule family="ipv4" source ipset="group_all" port port="2181" protocol="tcp" accept'
    state: enabled
  - service: ssh
    state: disabled